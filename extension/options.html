<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grabbr extension</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background:#0a0a0a; color:#fafafa; margin:0; padding:24px; width: 360px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: #a1a1aa; margin: 0 0 16px; line-height: 1.5; }
  label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #a1a1aa; display:block; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; background: #171717; border: 1px solid #262626; border-radius: 6px; color: #fafafa; padding: 8px 10px; font-family: monospace; font-size: 12px; }
  input:focus { outline: none; border-color: #525252; }
  .row { margin-top: 10px; }
  button { background: #fafafa; color: #0a0a0a; border: none; border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button.secondary { background: transparent; color: #fafafa; border: 1px solid #262626; margin-left: 8px; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 14px; font-size: 12px; min-height: 16px; }
  .ok { color: #34d399; }
  .bad { color: #f87171; }
</style>
</head>
<body>
  <h1>Connect to Grabbr</h1>
  <p class="sub">Open Grabbr &rarr; Settings &rarr; Browser extension &rarr; Enable, then paste the pairing code below.</p>
  <label for="code">Pairing code</label>
  <input id="code" type="text" placeholder="paste code here" autocomplete="off" spellcheck="false" />
  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect" class="secondary">Disconnect</button>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
