<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grabbr</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background:#0a0a0a; color:#fafafa; margin:0; padding:16px; width: 300px; }
  h1 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 16px; height: 16px; }
  p#url { font-size: 11px; font-family: monospace; color: #a1a1aa; margin: 0 0 12px; word-break: break-all; line-height: 1.4; max-height: 3.6em; overflow: hidden; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row[hidden] { display: none; }
  select { flex: 1; background: #171717; border: 1px solid #262626; border-radius: 6px; color: #fafafa; padding: 6px 8px; font-size: 12px; }
  select:focus { outline: none; border-color: #525252; }
  button#send { width: 100%; background: #fafafa; color: #0a0a0a; border: none; border-radius: 6px; padding: 9px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button#send:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
  .ok { color: #34d399; }
  .bad { color: #f87171; }
  #conn { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #a1a1aa; margin: 0 0 12px; }
  #conn .dot { width: 6px; height: 6px; border-radius: 50%; background: #52525b; flex: none; }
  #conn.ok .dot { background: #34d399; }
  #conn.bad .dot { background: #f87171; }
  #conn.warn .dot { background: #f59e0b; }
  #pair input { width: 100%; box-sizing: border-box; background: #171717; border: 1px solid #262626; border-radius: 6px; color: #fafafa; padding: 8px 10px; font-family: monospace; font-size: 12px; margin-bottom: 10px; }
  #pair input:focus { outline: none; border-color: #525252; }
  button#pair-connect { width: 100%; background: #fafafa; color: #0a0a0a; border: none; border-radius: 6px; padding: 9px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  button#pair-connect:disabled { opacity: 0.5; cursor: default; }
  a#disconnect-link { display: inline-block; margin-top: 12px; font-size: 11px; color: #71717a; text-decoration: none; }
  a#disconnect-link:hover { color: #a1a1aa; text-decoration: underline; }
</style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="" /> Send to Grabbr</h1>
  <div id="conn"><span class="dot" aria-hidden="true"></span><span id="conn-text">Checking connection…</span></div>

  <div id="pair" hidden>
    <input id="pair-code" type="text" placeholder="paste code here" autocomplete="off" spellcheck="false" />
    <button id="pair-connect">Connect</button>
  </div>

  <div id="send-area" hidden>
    <p id="url">Loading…</p>
    <div class="row" id="yt-row" hidden>
      <select id="quality" aria-label="Video quality">
        <option value="best">Best quality</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
      <select id="format" aria-label="Format">
        <option value="mp4">MP4</option>
        <option value="mp3">MP3 (audio)</option>
      </select>
    </div>
    <button id="send">Send to Grabbr</button>
  </div>

  <div id="status"></div>
  <a href="#" id="disconnect-link" hidden>Disconnect</a>
  <script src="popup.js"></script>
</body>
</html>
